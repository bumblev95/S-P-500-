<style>
:root{--bg:#07111f;--panel:#0f1b2b;--panel2:#0b1523;--line:#294058;--text:#edf5ff;--muted:#9db0c5;--blue:#7dd3fc;--green:#86efac;--yellow:#fde68a;--red:#fca5a5;--purple:#c4b5fd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 600px at 0 -10%,rgba(56,189,248,.14),transparent 58%),radial-gradient(900px 500px at 100% 0,rgba(167,139,250,.13),transparent 55%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.hero h1{margin:0;font-size:clamp(27px,4vw,43px);letter-spacing:-.04em;line-height:1.05}.hero p{color:var(--muted);max-width:850px;margin:9px 0 0}.back{color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#0b1725}.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:18px 0;padding:12px;background:rgba(9,20,34,.92);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px}select,button{font:inherit;color:var(--text);background:#08131f;border:1px solid #36516c;border-radius:10px;padding:9px 11px}select{min-width:240px}button{cursor:pointer}button.active{background:#12577a;border-color:#38bdf8}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(310px,.8fr);gap:14px}.panel{background:linear-gradient(180deg,rgba(15,27,43,.96),rgba(10,20,34,.94));border:1px solid var(--line);border-radius:17px;box-shadow:0 16px 40px rgba(0,0,0,.22);overflow:hidden}.pad{padding:17px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:14px 17px}.head h2,.head h3{margin:0}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}.card{background:#0d1a29;border:1px solid #294158;border-radius:14px;padding:13px}.card span{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:23px;margin-top:4px;letter-spacing:-.03em}.good{color:var(--green)!important}.warn{color:var(--yellow)!important}.bad{color:var(--red)!important}.info{color:var(--blue)!important}.chart{background:#07121e;border:1px solid #23384e;border-radius:13px;padding:9px}.chart svg{width:100%;height:auto;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;padding:6px 4px 2px}.legend i{display:inline-block;width:17px;height:3px;margin-right:5px;vertical-align:middle}.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.level{border:1px solid #294158;background:#0a1624;border-radius:13px;padding:12px}.level span{display:block;color:var(--muted);font-size:12px}.level strong{font-size:22px}.level small{display:block;color:var(--muted);margin-top:3px}.action{border:1px solid #3d5b74;background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(167,139,250,.08));border-radius:14px;padding:14px;margin-bottom:12px}.action .big{font-size:25px;font-weight:900}.reasons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.reasons>div{border:1px solid #283d53;border-radius:12px;padding:12px;background:#091522}.reasons h3{font-size:14px;margin:0 0 7px}.reasons ul{margin:0;padding-left:18px;color:#c7d6e6}.reasons li{margin:4px 0}.ranklist{display:grid;gap:8px}.rank{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid #2b4258;border-radius:12px;padding:10px;background:#091522;cursor:pointer}.rank:hover{border-color:#6ba8d0}.rank .n{width:27px;height:27px;border-radius:99px;background:#172b3f;display:grid;place-items:center;font-weight:800}.rank b{font-size:16px}.rank small{display:block;color:var(--muted)}.score{font-size:19px;font-weight:900}.note{margin-top:14px;padding:12px 14px;border-left:3px solid #6d8ca8;background:#102136;color:#c8d7e7;border-radius:0 9px 9px 0}.how{margin-top:14px}.how summary{cursor:pointer;color:#dceafa;font-weight:700}.how p{color:var(--muted);font-size:13px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:950px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:14px}.cards{grid-template-columns:1fr 1fr}.card strong{font-size:19px}.plan,.reasons{grid-template-columns:1fr}.toolbar select{width:100%;min-width:0}.chart{padding:4px}}

<body>
<div class="wrap">
  <div class="hero"><div><h1>초보자용 차트 가이드 <span class="info">v27 Preview</span></h1><p>“뭘 사야 하지?”에서 시작해, 현재 추세·눌림목·지지선·손절선·목표가를 한 화면에 정리합니다. 가격 예측이 아니라 기술적 조건을 규칙화한 교육용 의사결정 보조 도구입니다.</p></div><a class="back" href="./">← 기존 대시보드</a></div>
  <div class="toolbar"><select id="ticker"></select><button data-h="21">1개월</button><button data-h="84" class="active">4개월</button><button data-h="252">1년</button><span class="muted" id="asof"></span></div>
  <div id="app"><div class="empty">데이터를 불러오는 중…</div></div>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), finite=Number.isFinite;
const fmt=v=>finite(v)?v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const pct=(v,s=false)=>finite(v)?(s&&v>0?'+':'')+(v*100).toFixed(1)+'%':'—';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let data=null,horizon=84,symbol='NVDA';
function scoreTrend(e,p){const a=e.inputs||{};let s=50;if(a.ma20>0)s+=e.price>=a.ma20?7:-7;if(a.ma50>0)s+=e.price>=a.ma50?11:-11;if(a.ma200>0)s+=e.price>=a.ma200?13:-13;if(a.ma50>0&&a.ma200>0)s+=a.ma50>=a.ma200?10:-10;if(finite(a.return1m))s+=a.return1m>=0?5:-5;if(finite(a.return3m))s+=a.return3m>=0?6:-6;if(p)s+=p.direction==='up'?8:p.direction==='down'?-8:0;return clamp(Math.round(s),0,100)}
function trendLabel(s){return s>=75?'강한 상승 추세':s>=60?'상승 추세':s>=45?'중립 / 혼조':s>=30?'약한 하락 추세':'하락 추세'}
function dailySigma(e){const v=e.inputs&&e.inputs.volatility4m;return finite(v)?v/Math.sqrt(252):.02}
function historyLevels(e){const h=(e.history||[]).map(x=>x.close).filter(finite);if(h.length<10)return{};const last20=h.slice(-20),last63=h.slice(-63);return{low20:Math.min(...last20),high20:Math.max(...last20),low63:Math.min(...last63),high63:Math.max(...last63)}}
function tradePlan(e,p){const a=e.inputs||{},px=e.price,sig=dailySigma(e),hist=historyLevels(e),ts=scoreTrend(e,p);const supports=[a.ma20,a.ma50,a.ma200,hist.low20,hist.low63].filter(v=>finite(v)&&v>0&&v<=px*1.035).sort((x,y)=>y-x);let support=supports[0]||px*(1-clamp(sig*1.2,.02,.06));const zoneWidth=clamp(sig*.65,.009,.028);let buyMid=support,buyLow=buyMid*(1-zoneWidth),buyHigh=buyMid*(1+zoneWidth);if(buyHigh>px*1.025&&ts<60){buyMid=px*(1-clamp(sig,.015,.045));buyLow=buyMid*(1-zoneWidth);buyHigh=buyMid*(1+zoneWidth)}const stopBuffer=clamp(sig*1.65,.025,.085);const stop=buyLow*(1-stopBuffer);const risk=Math.max(.01,buyMid-stop);let target1=p&&finite(p.base)?p.base:buyMid+1.7*risk;target1=Math.max(target1,buyMid+1.35*risk);let target2=p&&finite(p.bull)?p.bull:buyMid+2.5*risk;target2=Math.max(target2,target1+0.65*risk);const rr=(target1-buyMid)/(buyMid-stop);let action='관망';let cls='warn';if((p&&p.direction==='down')||ts<35){action='관망 / 하락 위험';cls='bad'}else if(px>=buyLow&&px<=buyHigh&&ts>=55&&rr>=1.2){action='분할매수 후보 구간';cls='good'}else if(px>buyHigh&&ts>=58){action='추격매수보다 눌림목 대기';cls='info'}else if(px<buyLow&&ts>=45){action='지지 확인 후 접근';cls='warn'}else if(ts>=55){action='조건부 매수 관심';cls='info'}const distance=(px-buyMid)/px;return{ts,support,buyMid,buyLow,buyHigh,stop,target1,target2,rr,action,cls,distance,sig,hist}}
function candidateScore(e){const p=e.predictions&&e.predictions['84'];if(!p||e.status!=='ready')return-999;const t=scoreTrend(e,p),vol=e.inputs&&e.inputs.volatility4m||.4,ret=p.return||0;let s=t+clamp(ret*180, -10, 16)-clamp((vol-.25)*18,0,12);const plan=tradePlan(e,p);if(plan.rr>=1.5)s+=5;if(e.price>=plan.buyLow&&e.price<=plan.buyHigh)s+=4;return clamp(Math.round(s),0,100)}
function ranking(){return Object.values(data.stocks).map(e=>({e,s:candidateScore(e)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s).slice(0,10)}
function chart(e,p,plan){const hist=(e.history||[]).slice(-63),past=hist.length>1?hist.length-1:0,steps=Array.from({length:28},(_,i)=>horizon*i/27),future=steps.map(t=>{const center=p.dailyDrift*63*(1-Math.exp(-t/63)),spread=p.volatility*Math.sqrt(t/252);return{t,base:p.anchor*Math.exp(center),bear:p.anchor*Math.exp(center-spread),bull:p.anchor*Math.exp(center+spread)}});let vals=hist.map(x=>x.close).concat(future.flatMap(x=>[x.bear,x.bull]),[plan.buyLow,plan.buyHigh,plan.stop,plan.target1,plan.target2,e.inputs.ma20,e.inputs.ma50,e.inputs.ma200].filter(finite));let lo=Math.min(...vals),hi=Math.max(...vals);if(!(lo>0)||!finite(hi))return'';const pad=Math.max((Math.log(hi)-Math.log(lo))*.08,.02);lo=Math.log(lo)-pad;hi=Math.log(hi)+pad;const W=760,H=360,L=72,R=18,T=16,B=43,x=t=>L+(t+past)/(horizon+past)*(W-L-R),y=v=>T+(hi-Math.log(v))/(hi-lo)*(H-T-B),pt=(t,v)=>x(t).toFixed(1)+','+y(v).toFixed(1);let s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';for(let i=0;i<5;i++){const v=Math.exp(lo+(hi-lo)*i/4),yy=y(v);s+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="#20364c"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" fill="#9db0c5" font-size="12">'+fmt(v)+'</text>'}const poly=future.map(q=>pt(q.t,q.bull)).concat(future.slice().reverse().map(q=>pt(q.t,q.bear))).join(' ');s+='<polygon points="'+poly+'" fill="#164d70" fill-opacity=".42"/>';if(hist.length>1)s+='<polyline points="'+hist.map((q,i)=>pt(i-past,q.close)).join(' ')+'" fill="none" stroke="#e2edf8" stroke-width="2.1"/>';s+='<polyline points="'+future.map(q=>pt(q.t,q.base)).join(' ')+'" fill="none" stroke="#7dd3fc" stroke-width="2.8" stroke-dasharray="7 4"/>';const level=(v,color,label,dash='')=>{if(!finite(v)||v<=0)return'';const yy=y(v);return'<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="'+color+'" stroke-width="1.6" '+(dash?'stroke-dasharray="'+dash+'"':'')+'/><text x="'+(W-R-3)+'" y="'+(yy-4)+'" text-anchor="end" fill="'+color+'" font-size="12">'+label+' '+fmt(v)+'</text>'};s+=level(plan.buyHigh,'#86efac','매수 상단','4 4')+level(plan.buyLow,'#86efac','매수 하단','4 4')+level(plan.stop,'#fca5a5','손절','5 4')+level(plan.target1,'#fde68a','1차 목표','6 4')+level(plan.target2,'#c4b5fd','2차 목표','6 4');s+=level(e.inputs.ma50,'#7895ad','MA50','2 5')+level(e.inputs.ma200,'#62778b','MA200','2 5');s+='<circle cx="'+x(0)+'" cy="'+y(e.price)+'" r="4" fill="#fff"/><text x="'+x(0)+'" y="'+(H-18)+'" text-anchor="middle" fill="#9db0c5" font-size="12">현재</text><text x="'+x(horizon)+'" y="'+(H-18)+'" text-anchor="end" fill="#9db0c5" font-size="12">+'+(horizon===21?'1개월':horizon===84?'4개월':'1년')+'</text></svg>';return s}
function reasons(e,p,plan){const a=e.inputs||{},pos=[],risk=[];if(e.price>a.ma50)pos.push('현재가가 50일 이동평균 위');else risk.push('현재가가 50일 이동평균 아래');if(a.ma50>a.ma200)pos.push('50일선이 200일선 위: 중기 추세 우호');else risk.push('50일선이 200일선 아래: 중기 추세 약함');if(finite(a.return1m)&&(a.return1m>0?pos:risk).push('최근 1개월 수익률 '+pct(a.return1m,true)));if(finite(a.return3m)&&(a.return3m>0?pos:risk).push('최근 3개월 수익률 '+pct(a.return3m,true)));if(p.direction==='up')pos.push('선택 기간 기준 전망이 상승 우세');if(p.direction==='down')risk.push('선택 기간 기준 전망이 하락 우세');if(a.volatility4m>.5)risk.push('최근 변동성이 높음: 손절 폭과 비중 주의');if(plan.rr>=1.5)pos.push('모델상 1차 목표 대비 손익비 '+plan.rr.toFixed(1));else risk.push('1차 목표 대비 손익비가 낮음 '+plan.rr.toFixed(1));return{pos,risk}}
function render(){if(!data)return;const e=data.stocks[symbol];if(!e){$('#app').innerHTML='<div class="empty">이 종목의 데이터가 없습니다.</div>';return}const p=e.predictions&&e.predictions[String(horizon)];if(!p){$('#app').innerHTML='<div class="empty">이 기간의 전망 데이터가 부족합니다.</div>';return}const plan=tradePlan(e,p),why=reasons(e,p,plan),rank=ranking();$('#asof').textContent='기준 '+e.asOf+' · 모델 '+data.model;const c=plan.ts>=60?'good':plan.ts<40?'bad':'warn';const forecastReturn=p.base/e.price-1;let html='<div class="cards"><div class="card"><span>현재가</span><strong>'+fmt(e.price)+'</strong></div><div class="card"><span>차트 추세</span><strong class="'+c+'">'+trendLabel(plan.ts)+'</strong><small class="muted">점수 '+plan.ts+'/100</small></div><div class="card"><span>선택 기간 기준 전망</span><strong class="'+(forecastReturn>0.02?'good':forecastReturn<-0.02?'bad':'warn')+'">'+pct(forecastReturn,true)+'</strong></div><div class="card"><span>현재 행동</span><strong class="'+plan.cls+'">'+plan.action+'</strong></div></div><div class="grid"><main><section class="panel"><div class="head"><h2>'+symbol+' 차트 + 매매 레벨</h2><span class="muted">초보자용 시각화</span></div><div class="pad"><div class="chart">'+chart(e,p,plan)+'<div class="legend"><span><i style="background:#e2edf8"></i>과거 종가</span><span><i style="background:#7dd3fc"></i>기준 전망</span><span><i style="background:#86efac"></i>매수 구간</span><span><i style="background:#fca5a5"></i>손절</span><span><i style="background:#fde68a"></i>목표가</span></div></div><div class="action"><div class="muted">지금 한 줄 판단</div><div class="big '+plan.cls+'">'+plan.action+'</div><div class="muted">현재가와 지지선·이동평균·선택 기간 전망을 함께 본 규칙 기반 판단</div></div><div class="plan"><div class="level"><span>매수 관심 구간</span><strong class="good">'+fmt(plan.buyLow)+' ~ '+fmt(plan.buyHigh)+'</strong><small>핵심 지지선 주변. 한 번에 전량보다 분할 접근용.</small></div><div class="level"><span>무효화 / 손절 기준</span><strong class="bad">'+fmt(plan.stop)+'</strong><small>지지선이 무너졌다고 보는 기술적 기준.</small></div><div class="level"><span>1차 목표가</span><strong class="warn">'+fmt(plan.target1)+'</strong><small>기준 전망과 최소 손익비를 함께 반영.</small></div><div class="level"><span>2차 목표가</span><strong style="color:var(--purple)">'+fmt(plan.target2)+'</strong><small>강세 시나리오 성격의 공격적 목표.</small></div></div><div class="reasons"><div><h3 class="good">긍정 신호</h3><ul>'+((why.pos.length?why.pos:['뚜렷한 긍정 신호 없음']).map(x=>'<li>'+x+'</li>').join(''))+'</ul></div><div><h3 class="bad">주의 신호</h3><ul>'+((why.risk.length?why.risk:['뚜렷한 위험 신호 없음']).map(x=>'<li>'+x+'</li>').join(''))+'</ul></div></div><div class="note"><b>초보자용 사용법:</b> ‘매수 후보’라도 현재가가 매수 구간보다 많이 위면 추격하지 않고 기다립니다. 매수 후 손절 기준이 깨지면 시나리오가 틀렸다고 보고 재평가하고, 1차 목표에서는 일부 이익실현 후 나머지를 2차 목표 또는 추세 이탈까지 보는 식으로 사용합니다.</div><details class="how"><summary>이 숫자는 어떻게 계산했나?</summary><p>지지선 후보는 MA20·MA50·MA200과 사용 가능한 최근 저점 중 현재가에 가장 가까운 값을 사용합니다. 매수 구간 폭과 손절 여유는 최근 4개월 연환산 변동성을 일간 변동성으로 환산해 조정합니다. 목표가는 기존 v26의 기간별 기준/강세 전망과 최소 손익비를 결합합니다.</p><p>추세 점수는 현재가의 이동평균 상·하 위치, MA50/MA200 배열, 최근 1·3개월 수익률, 기간별 방향 전망을 합산한 휴리스틱입니다. 검증된 승률이나 투자수익률을 뜻하지 않습니다.</p></details></div></section></main><aside><section class="panel"><div class="head"><h3>오늘 보기 좋은 후보 TOP 10</h3><span class="muted">4개월 기준</span></div><div class="pad ranklist">'+rank.map((x,i)=>{const q=x.e,p4=q.predictions['84'],pl=tradePlan(q,p4);return'<div class="rank" data-symbol="'+q.symbol+'"><span class="n">'+(i+1)+'</span><div><b>'+q.symbol+'</b><small>'+trendLabel(pl.ts)+' · 4개월 '+pct(p4.return,true)+'</small><small>'+pl.action+'</small></div><span class="score">'+x.s+'</span></div>'}).join('')+'</div></section><section class="panel" style="margin-top:14px"><div class="head"><h3>초보자 체크 3개</h3></div><div class="pad"><p>① 현재가가 매수 관심 구간 안/근처인가?</p><p>② 손절까지 감당 가능한가?</p><p>③ 목표가까지 손익비가 최소 1.2~1.5 이상인가?</p><p class="muted">세 가지 중 하나라도 애매하면 ‘관망’이 정상적인 결과입니다.</p></div></section></aside></div>';$('#app').innerHTML=html;document.querySelectorAll('.rank').forEach(el=>el.onclick=()=>{symbol=el.dataset.symbol;$('#ticker').value=symbol;render();scrollTo({top:0,behavior:'smooth'})})}
async function load(){try{const r=await fetch('forecasts/latest.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);data=await r.json();const syms=Object.keys(data.stocks).sort();if(!data.stocks[symbol])symbol=syms[0];$('#ticker').innerHTML=syms.map(s=>'<option value="'+s+'">'+s+'</option>').join('');$('#ticker').value=symbol;render()}catch(e){$('#app').innerHTML='<div class="empty">전망 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>'}}
$('#ticker').onchange=e=>{symbol=e.target.value;render()};document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{horizon=Number(b.dataset.h);document.querySelectorAll('[data-h]').forEach(x=>x.classList.toggle('active',x===b));render()});load();
})();
</script>
