  <script>

    function historyLevels(e){const h=(e.history||[]).map(x=>Number(x.close)).filter(v=>finite(v)&&v>0);if(h.length<10)return{};return{low20:Math.min(...h.slice(-20)),low63:Math.min(...h.slice(-63))}}
    function tradePlan(e,p){const plan=TechnicalGuide.plan(e,p,market),ai=LearnedGuide.inspect(learned,e,p.horizon);if(!ai.eligible){plan.blocks.unshift('AI 예측 검증 조건 미충족');if(plan.tone==='buy'){plan.action='조건 확인 · 관망';plan.tone='wait';plan.code='watch'}}else if(ai.forecast.direction==='down'){plan.blocks.unshift('학습 모델 하락 우세');plan.action='신규 진입 보류';plan.tone='avoid';plan.code='avoid'}return plan}

      <section class="guide"><strong>이 화면을 읽는 가장 쉬운 방법:</strong> “오늘의 행동”을 먼저 보고, 매수구간에 들어왔을 때만 손절 기준과 목표가를 확인하세요. AI 연구 방향은 모델의 기간별 목표를 연결한 선입니다. 1년 뒤 변화가 작아도 중간 변동이 작다는 뜻은 아닙니다.<details><summary>계산 방식과 한계 보기</summary><p>추세 점수는 이동평균 배열·실제 수익률·Wilder RSI(14)·MACD(12,26,9)를 자료가 있는 항목끼리 가중 평균한 규칙 점수입니다. 예측값을 다시 점수에 넣지 않습니다. 실제 종가 60개 미만이면 신규 진입 판단을 보류합니다. 지지는 현재가 아래 이동평균·양옆 2일로 확인된 종가 피벗, 목표는 관심 구간 위 관측 저항선입니다. 손절은 구간 하단에서 일별 종가 변동폭의 1.5배를 뺀 값(ATR 아님), 손익비는 구간 상단 진입 기준입니다. 목표가를 최소 손익비에 맞춰 높이지 않습니다. 시장 주의 시 최소 손익비를 1.5에서 2로 올리고 위험·자료 부족 시 진입을 보류합니다. 뉴스는 주제 분류이며 가격 예측에 자동 반영되지 않습니다. 점선의 계산 출처는 차트 위에 표시합니다. 유효한 학습형 연구 전망은 검증 미통과여도 표시합니다. 기준일·원래 목표가·검증 등급을 함께 보세요. 연구값을 표시해도 신규 매수·후보 순위의 AI 검증 조건은 그대로 적용합니다. 학습 결과가 없거나 손상됐을 때만 기존 추세 계산을 사용합니다. 전망 폭·점수는 보정된 확률이 아니며 성능 향상은 아직 검증되지 않았습니다.</p></details><details><summary>기술 지표·검증 상태</summary><p>실제 종가 ${plan.indicators.rows.length}개 · RSI ${finite(plan.indicators.rsi)?plan.indicators.rsi.toFixed(1):'자료 부족'} · MACD 히스토그램 ${finite(plan.indicators.macd)?plan.indicators.macd.toFixed(3):'자료 부족'} · 20일 가격 z-score ${finite(plan.indicators.z)?plan.indicators.z.toFixed(2):'자료 부족'} · 상대 거래량 ${finite(plan.indicators.relativeVolume)?plan.indicators.relativeVolume.toFixed(2)+'배':'자료 부족'} · 저항선 손익비 ${finite(plan.rr)?plan.rr.toFixed(2):'자료 부족'} · 기존 전망 검증 표본 ${e.backtest?.[String(horizon)]?.n||0}개. 새 진입 규칙은 실거래·외부표본 성과 미검증입니다.</p></details><details class="site-disclosure"><summary>기간별 안정성·기존 모델 비교</summary>${StabilityPanel.panel(stability,horizon,learned)}${LearnedGuide.comparisonPanel(learned,horizon,comparison)}</details></section>`;document.querySelectorAll('[data-path]').forEach(b=>b.addEventListener('click',()=>{pathMode=b.dataset.path;render()}));TradeJournal.mount({e,plan,h:horizon,ai,live});DecisionSupport.mountStock({e,plan,h:horizon,ai:{...ai,generatedAt:learned?.generatedAt}});renderCandidates()}
    function selectSymbol(value,scroll=false){const next=String(value||'').trim().toUpperCase();if(!dataset?.stocks?.[next]){$('#tickerInput').value=symbol;return}symbol=next;$('#tickerInput').value=symbol;render();if(scroll)window.scrollTo({top:0,behavior:'smooth'})}function showError(message){$('#app').innerHTML=`<div class="empty"><strong>데이터를 표시하지 못했습니다</strong>${esc(message)}<br><button type="button" class="retry" id="retry">다시 불러오기</button></div>`;$('#retry')?.addEventListener('click',load)}
    async function load(){$('#app').innerHTML='<div class="empty"><strong>차트 데이터를 불러오는 중입니다</strong>잠시만 기다려 주세요.</div>';try{const response=await fetch('forecasts/latest.json?refresh='+Math.floor(Date.now()/60000),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);dataset=await response.json();try{const mr=await fetch('market/latest.json',{cache:'no-store'});market=mr.ok?await mr.json():null}catch(_){market=null}try{const lr=await fetch('ml/latest.json?refresh='+Math.floor(Date.now()/60000),{cache:'no-store'});learned=lr.ok?await lr.json():null}catch(_){learned=null}try{const cr=await fetch('ml/comparison.json',{cache:'no-store'});comparison=cr.ok?await cr.json():null}catch(_){comparison=null}try{const sr=await fetch('ml/live-results.json',{cache:'no-store'});live=sr.ok?await sr.json():null}catch(_){live=null}try{const sr=await fetch('ml/stability.json',{cache:'no-store'});stability=sr.ok?await sr.json():null}catch(_){stability=null}await DecisionSupport.load();learned=DecisionSupport.applyStocks(learned);const symbols=Object.keys(dataset.stocks||{}).sort();if(!symbols.length)throw new Error('종목 없음');if(!dataset.stocks[symbol])symbol=dataset.stocks.NVDA?'NVDA':symbols[0];$('#tickerList').innerHTML=symbols.map(s=>`<option value="${esc(s)}"></option>`).join('');$('#tickerInput').value=symbol;render()}catch(error){showError('최신 전망 파일을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.')}}
    $('#tickerInput').addEventListener('change',e=>selectSymbol(e.target.value));$('#tickerInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();selectSymbol(e.currentTarget.value);e.currentTarget.blur()}});document.querySelectorAll('[data-h]').forEach(button=>button.addEventListener('click',()=>{horizon=Number(button.dataset.h);document.querySelectorAll('[data-h]').forEach(x=>x.classList.toggle('active',x===button));render()}));load();
  })();
  </script>
