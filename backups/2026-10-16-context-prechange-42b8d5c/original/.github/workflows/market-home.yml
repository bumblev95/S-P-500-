name: Update and validate market home
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'stocks.html'
      - 'assets/market-home*'
      - 'assets/stock-assessment.js'
      - 'assets/technical-guide.js'
      - 'assets/company-names.js'
      - 'forecasts/latest.json'
      - 'market/latest.json'
      - 'scripts/build_market_home.py'
      - 'scripts/translate_company_news.py'
      - 'scripts/test_company_news_translation.py'
      - 'scripts/build_home_rankings.cjs'
      - 'scripts/test_market_home*'
      - 'scripts/fixtures/market-headline-terms.json'
      - 'scripts/check_market_home_browser.cjs'
      - 'market/home-reviewed-news.json'
      - '.github/workflows/market-home.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'stocks.html'
      - 'assets/market-home*'
      - 'assets/stock-assessment.js'
      - 'assets/technical-guide.js'
      - 'assets/company-names.js'
      - 'forecasts/latest.json'
      - 'market/latest.json'
      - 'scripts/build_market_home.py'
      - 'scripts/translate_company_news.py'
      - 'scripts/test_company_news_translation.py'
      - 'scripts/build_home_rankings.cjs'
      - 'scripts/test_market_home*'
      - 'scripts/fixtures/market-headline-terms.json'
      - 'scripts/check_market_home_browser.cjs'
      - 'market/home-reviewed-news.json'
      - '.github/workflows/market-home.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Update S&P 500 EOD prices', 'Update public market context', 'Update decision support and live scorecard']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '20 * * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: market-home-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
jobs:
  home:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate daily TOP 3, semantic no-ops, periods and cache recovery
        run: |
          python -m unittest discover -s scripts -p test_market_home.py
          python -m unittest discover -s scripts -p test_company_news_translation.py
          node scripts/test_market_home.cjs
          node --check assets/market-home.js
      - name: Refresh daily TOP 3 before news translation
        run: python scripts/build_market_home.py --rankings-only
      - name: Publish updated daily rankings immediately
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market/home.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily buy and sell TOP 3'
            git pull --rebase origin main
            git push
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
      - uses: actions/cache@v4
        with:
          path: research/source-cache/home-news-ko
          key: home-news-ko-v1-${{ github.run_id }}
          restore-keys: home-news-ko-v1-
      - name: Install Korean summary translation runtime
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements-news-translation.txt
      - name: Verify retained headline meanings with the live translator
        if: github.event_name == 'pull_request'
        env:
          OMP_NUM_THREADS: '2'
          HF_HUB_DISABLE_XET: '1'
        run: |
          python - <<'PY'
          from copy import deepcopy
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_market_home import ROOT, translate_news, usable_translation, valid_korean_headline
          from translate_company_news import engine, verify_engine
          fixture = json.loads(Path('scripts/fixtures/market-headline-terms.json').read_text())
          original = fixture['news']
          articles = deepcopy(original)
          translate = engine(ROOT/'research/source-cache/home-news-ko/model')
          verify_engine(translate)
          translate_news(articles, ROOT, translate)
          assert all(usable_translation(item) for item in articles)
          for before, after in zip(original, articles):
              changed = {'headlineKo', 'translationStatus', 'headlineFallbackVersion'}
              assert {k:v for k,v in before.items() if k not in changed} == {k:v for k,v in after.items() if k not in changed}
              if valid_korean_headline(before['headlineKo'], before['title']):
                  assert before == after, 'Healthy translation was changed'
          print('HEADLINE_MEANING_PREVIEW='+json.dumps(articles, ensure_ascii=False))
          PY
      - name: Collect closed prices, source news and Korean summaries
        env:
          OMP_NUM_THREADS: '2'
          HF_HUB_DISABLE_XET: '1'
        run: python scripts/build_market_home.py
      - name: Show public snapshot for verification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot=json.loads(Path('market/home.json').read_text())
          assert len(snapshot['recap']['sectors'])==11
          assert len(snapshot['rankings']['buy'])<=3 and len(snapshot['rankings']['sell'])<=3
          ranks=snapshot['rankings']
          assert 'waiting' not in ranks and ranks['policy']=='daily-top3-v1'
          if ranks['eligibleCount']>=6:
              assert len(ranks['buy'])==3 and len(ranks['sell'])==3
          symbols=[q['symbol'] for side in ('buy','sell') for q in ranks[side]]
          assert len(symbols)==len(set(symbols))
          assert all(q['asOf']==ranks['asOf'] for side in ('buy','sell') for q in ranks[side])
          print('MARKET_HOME_SNAPSHOT='+json.dumps(snapshot,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Install browser validation runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify mobile, desktop, charts and existing stock navigation
        run: node scripts/check_market_home_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: market-home-preview
          path: |
            market/home.json
            market/home-cache.json
            home-preview/
          retention-days: 7
      - name: Publish current homepage snapshot
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market/home.json market/home-cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update market homepage briefing'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Homepage content and feed state unchanged; no commit needed.'
          fi
      - name: Refresh the published website
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
