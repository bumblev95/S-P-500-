<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고급 분석 · Equity Research</title><meta name="description" content="자동 갱신 데이터로 종목을 선별하고 상대 성과·상관관계·밸류에이션 민감도와 예측 검증을 비교하는 주식 분석 워크스페이스"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c1421'/%3E%3Cpath d='M14 46V32m12 14V21m12 25V28m12 18V12' stroke='%237bf1cb' stroke-width='6'/%3E%3C/svg%3E"><link rel="stylesheet" href="assets/advanced.css?v=2"><script defer src="assets/advanced-engine.js?v=1"></script><script defer src="assets/market-visuals.js?v=1"></script><script defer src="assets/learned-guide.js"></script><script defer src="assets/advanced-page.js?v=2"></script></head><body><main class="researchShell">
<header><div><span class="eyebrow">EQUITY RESEARCH / ADVANCED</span><h1>고급 분석</h1></div><nav aria-label="주요 페이지"><a href="./">주식 가이드</a><a href="crypto.html">코인 현물</a><a href="futures.html">단기 선물</a><a href="advanced.html" aria-current="page">고급 분석</a></nav></header>
<section id="sourceStatus" class="sourceGrid" aria-label="자동 데이터 상태"><div>자동 데이터 확인 중…</div></section>
<div class="workbar"><div class="workspaceTabs" role="tablist" aria-label="분석 도구"><button role="tab" data-view="screen" aria-selected="true">종목 탐색</button><button role="tab" data-view="compare" aria-selected="false">상대 성과·상관관계</button><button role="tab" data-view="value" aria-selected="false">밸류에이션 실험</button><button role="tab" data-view="validation" aria-selected="false">예측 검증</button></div><div class="actions"><button id="refresh">최신 파일 읽기</button><button id="export">필터 결과 CSV</button></div></div>
<section id="screenControls" class="filterPanel" aria-label="종목 선별 조건"><div class="filterMain"><label>종목 검색<input id="search" type="search" placeholder="티커 또는 회사명" autocomplete="off"></label><label>섹터<select id="sector"><option value="">전체 섹터</option></select></label><label>빠른 조건<select id="preset"><option value="all">전체 종목</option><option value="quality">흑자·매출 성장</option><option value="trend">상승 배열</option><option value="lowvol">변동성 30% 이하</option><option value="watch">내 관심종목</option></select></label><label class="check"><input id="freshOnly" type="checkbox">최신 자료만</label><button id="resetFilters">필터 초기화</button></div><details><summary>상세 필터</summary><div class="filterNumbers"><label>Forward P/E 상한<input id="maxPe" type="number" min="0" placeholder="제한 없음"></label><label>매출 성장률 하한 %<input id="minGrowth" type="number" placeholder="제한 없음"></label><label>영업이익률 하한 %<input id="minMargin" type="number" placeholder="제한 없음"></label><label>연환산 변동성 상한 %<input id="maxVol" type="number" min="0" placeholder="제한 없음"></label><label>시가총액 하한 ($B)<input id="minCap" type="number" min="0" placeholder="제한 없음"></label></div></details></section>
<section class="selectionBar"><label>분석 종목<select id="asset"><option>NVDA</option></select></label><div><span class="muted">비교 바구니 · 최대 4개</span><div id="basket"></div></div><span id="feedback" role="status" aria-live="polite"></span></section>
<div class="researchGrid"><section id="content" aria-label="선택한 분석 도구"><div class="panel empty">가격·기업 지표를 자동으로 불러오는 중입니다.</div></section><aside id="inspector"></aside></div>
<footer>가격: 미국 장 마감 후 자동 수집 · 기업 지표: 매주 자동 수집 · 최신 파일은 화면을 열 때와 화면을 보는 동안 15분마다 적용됩니다. 갱신은 지연될 수 있습니다.<br><a href="advanced-legacy.html">이전 수동 편집·가족 관심종목 관리 화면</a> · 계산 결과는 투자 권유나 수익 보장이 아닙니다.</footer>
