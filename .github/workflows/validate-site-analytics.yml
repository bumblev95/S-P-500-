name: Validate site analytics
on:
  pull_request:
    paths: ['*.html', 'assets/site-analytics*', 'assets/company-search.js', 'assets/crypto.js', 'assets/perp-page.js', 'assets/advanced-page.js', 'scripts/*site_analytics*', '.github/workflows/validate-site-analytics.yml']
  push:
    branches: [main]
    paths: ['*.html', 'assets/site-analytics*', 'assets/company-search.js', 'assets/crypto.js', 'assets/perp-page.js', 'assets/advanced-page.js', 'scripts/*site_analytics*', '.github/workflows/validate-site-analytics.yml']
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check analytics syntax
        run: node --check assets/site-analytics.js
      - name: Install browser validation runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify consent and events without contacting Google
        run: node scripts/check_site_analytics_browser.cjs
