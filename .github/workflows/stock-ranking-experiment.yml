name: Run frozen 12-month stock ranking experiment
on:
  push:
    branches: [research/stock-validation-e0]
    paths:
      - '.github/workflows/stock-ranking-experiment.yml'
      - 'scripts/run_stock_ranking_experiment.py'
      - 'scripts/test_stock_ranking_experiment.py'
      - 'scripts/requirements-stock-experiments.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stock-ranking-experiment
  cancel-in-progress: false
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: |
            research/history
            research/source-cache
          key: environment-history-34771649966
          fail-on-cache-miss: true
      - run: pip install -r scripts/requirements-stock-experiments.txt
      - name: Verify chronology and selection before fitting
        run: python -m unittest discover -s scripts -p 'test_stock_*_experiment.py'
      - name: Fit four frozen ranking configurations
        run: python scripts/run_stock_ranking_experiment.py
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
      - name: Retain complete predictions and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-ranking-e1-results
          path: research/experiments/2026-09-13/
          retention-days: 90
      - name: Save experiment results on its research branch
        if: success()
        env:
          EXPERIMENT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/experiments/2026-09-13/input-audit.json research/experiments/2026-09-13/e1-manifest.json research/experiments/2026-09-13/e1-ranking.json research/experiments/2026-09-13/E1-RESULTS.md research/experiments/2026-09-13/e1-issued.json
          git diff --cached --quiet || git commit -m 'Publish frozen 12-month ranking experiment results'
          git pull --rebase origin "$EXPERIMENT_BRANCH"
          git push origin "HEAD:$EXPERIMENT_BRANCH"
