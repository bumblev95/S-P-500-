name: Update company news and impact labels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_company_news.py'
      - 'scripts/test_company_news.py'
      - '.github/workflows/update-company-news.yml'
  schedule:
    - cron: '15 14,22 * * 1-5'
permissions:
  contents: write
  pages: write
concurrency:
  group: company-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: research/source-cache/news
          key: company-news-${{ github.run_id }}
          restore-keys: company-news-
      - name: Validate dates, issuer relevance, labels and failure recovery
        run: python -m unittest discover -s scripts -p test_company_news.py
      - name: Collect current company headlines and explainable impact labels
        run: python scripts/build_company_news.py
      - name: Publish news snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news/latest.json news/request-state.json
          git diff --cached --quiet || git commit -m 'Update company news and preliminary impact labels'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Refresh the published dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
