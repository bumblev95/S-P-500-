name: Validate TOP3 ranking research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*top3*'
      - 'research/top3-ranking/**'
      - '.github/workflows/validate-top3-ranking.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - run: node scripts/test_top3_rankings.cjs
      - run: python -m unittest discover -s scripts -p test_top3_rankings.py
      - run: python scripts/analyze_top3_rankings.py --validate-only
