name: Validate advanced research
on:
  push:
    paths:
      - 'advanced.html'
      - 'assets/advanced*'
      - 'assets/company-names.js'
      - 'assets/company-search*'
      - 'scripts/test_company_search.cjs'
      - 'scripts/test_advanced.cjs'
      - 'scripts/build_forecasts.py'
      - 'tests/test_forecasts.py'
      - 'scripts/update_eod_prices.py'
      - 'scripts/eod_symbol_mapping.py'
      - 'scripts/eod_publication.py'
      - 'scripts/requirements-eod.txt'
      - 'tests/test_eod_pipeline.py'
      - '.github/workflows/validate-advanced.yml'
  pull_request:
    paths:
      - 'advanced.html'
      - 'assets/advanced*'
      - 'assets/company-names.js'
      - 'assets/company-search*'
      - 'scripts/test_company_search.cjs'
      - 'scripts/test_advanced.cjs'
      - 'scripts/build_forecasts.py'
      - 'tests/test_forecasts.py'
      - 'scripts/update_eod_prices.py'
      - 'scripts/eod_symbol_mapping.py'
      - 'scripts/eod_publication.py'
      - 'scripts/requirements-eod.txt'
      - 'tests/test_eod_pipeline.py'
      - '.github/workflows/validate-advanced.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check assets/company-names.js && node --check assets/company-search.js
      - run: node scripts/test_company_search.cjs
      - run: node --check assets/advanced-page.js
      - run: node scripts/test_advanced.cjs
      - run: python -m unittest discover -s tests -p test_forecasts.py
      - run: pip install -r scripts/requirements-eod.txt
      - run: python -m unittest discover -s tests -p test_eod_pipeline.py
