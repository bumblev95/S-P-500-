name: Check FRED runner connectivity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-fred-connectivity.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check FRED CSV over IPv4
        run: |
          set +e
          curl -4 --http1.1 --connect-timeout 5 --max-time 20 --retry 0 --silent --show-error --fail --user-agent 'PublicMarketMonitor/1.0' --output /tmp/fred-check.csv --write-out 'HTTP %{http_code}; connect %{time_connect}; total %{time_total}\n' 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10'
          result=$?
          echo "curl exit: $result"
          if [ "$result" = 0 ]; then
            head -c 180 /tmp/fred-check.csv
          fi
