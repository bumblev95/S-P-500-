name: Fit conditional quarterly increment and verify frozen stock experiments
on:
  push:
    branches: [research/stock-validation-e0]
    paths:
      - '.github/workflows/stock-quarterly-experiment.yml'
      - 'scripts/run_stock_quarterly_experiment.py'
      - 'scripts/test_stock_quarterly_fit_experiment.py'
      - 'scripts/verify_stock_experiment_replay.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: stock-quarterly-experiment
  cancel-in-progress: false
jobs:
  quarterly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: |
            research/history
            research/source-cache
          key: environment-history-34771649966
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            research/experiments/2026-09-13/sec-supplement
            research/experiments/2026-09-13/e2-supplement-manifest.json
          key: stock-validation-quarterly-supplement-v1
          fail-on-cache-miss: true
      - run: pip install -r scripts/requirements-stock-experiments.txt
      - run: python -m unittest discover -s scripts -p 'test_stock_*_experiment.py'
      - name: Fit quarterly increment only if its data controls pass
        run: python scripts/run_stock_quarterly_experiment.py
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
      - name: Retrieve the original full E1 predictions for independent replay
        uses: actions/download-artifact@v4
        with:
          name: stock-ranking-e1-results
          run-id: 34776208493
          github-token: ${{ github.token }}
          path: /tmp/stock-e1-original
      - name: Reproduce published scores and refit after removing future inputs
        run: python scripts/verify_stock_experiment_replay.py --checkpoint /tmp/stock-e1-original/e1-checkpoint.json
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
      - name: Preserve complete experiment records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-quarterly-e2-e3-results
          path: research/experiments/2026-09-13/
          retention-days: 90
      - name: Save comparisons and verification on the research branch
        if: success()
        env:
          EXPERIMENT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/experiments/2026-09-13/e2-quarterly.json research/experiments/2026-09-13/E2-INCREMENT-RESULTS.md research/experiments/2026-09-13/e3-verification.json research/experiments/2026-09-13/E3-RESULTS.md
          git diff --cached --quiet || git commit -m 'Publish quarterly ranking increment and truncated-future replay verification'
          git pull --rebase origin "$EXPERIMENT_BRANCH"
          git push origin "HEAD:$EXPERIMENT_BRANCH"
