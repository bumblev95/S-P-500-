name: Update public market context
on:
  schedule:
    - cron: '45 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect public indicators and official releases
        run: python scripts/build_market_context.py
      - name: Publish snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public early warning snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Refresh the published dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
