name: Update decision support and live scorecard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_decision_support.py'
      - 'scripts/build_market_context.py'
      - 'scripts/test_decision_support.py'
      - 'assets/decision-support*'
      - '.github/workflows/update-decision-support.yml'
  workflow_run:
    workflows: ['Update S&P 500 EOD prices', 'Update crypto market guide', 'Update environment model research', 'Update S&P 500 fundamentals']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '50 3 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: decision-support
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate chronology, promotion and trade calculations
        run: |
          python -m unittest discover -s scripts -p test_decision_support.py
          node scripts/test_decision_support.cjs
      - name: Collect current credit, rates and dollar indicators
        run: python scripts/build_market_context.py
      - name: Preserve first records, score outcomes and evaluate promotions
        run: python scripts/build_decision_support.py
      - name: Save public forecasts and scorecard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add decision market/latest.json
          git diff --cached --quiet || git commit -m 'Update prospective forecast scorecard and market risk'
          git pull --rebase origin main
          git push
      - name: Refresh dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
