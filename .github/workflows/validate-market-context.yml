name: Validate FRED collection
on:
  push:
    branches: [codex/fred-actions-recovery]
    paths:
      - '.github/workflows/validate-market-context.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare FRED connection paths without publishing data
        run: |
          python - <<'PY'
          import concurrent.futures, json, socket, ssl, subprocess, time, urllib.request
          from datetime import datetime, timedelta, timezone
          start = (datetime.now(timezone.utc).date()-timedelta(days=730)).isoformat()
          url = 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd='+start
          ua = 'PublicMarketMonitor/1.0'
          print('Python TLS:', ssl.OPENSSL_VERSION, flush=True)
          print('FRED DNS:', socket.getaddrinfo('fred.stlouisfed.org', 443, type=socket.SOCK_STREAM), flush=True)
          def probe(name, flags):
              began = time.monotonic()
              try:
                  if name.startswith('urllib'):
                      ctx = ssl.create_default_context()
                      ctx.set_alpn_protocols(['http/1.1'])
                      if name == 'urllib TLS 1.2': ctx.maximum_version = ssl.TLSVersion.TLSv1_2
                      agent = 'Mozilla/5.0' if name == 'urllib browser UA' else ua
                      with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':agent}), timeout=10, context=ctx) as r:
                          print(json.dumps(dict(probe=name,status=r.status,elapsed=round(time.monotonic()-began,2),sample=r.read(100).decode('utf-8-sig'))),flush=True)
                  else:
                      p = subprocess.run(['curl','-sS','--connect-timeout','5','--max-time','10','-A',ua,*flags,'-w','\nhttp=%{http_code} remote=%{remote_ip} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} first=%{time_starttransfer}',url],capture_output=True,text=True,timeout=12)
                      print(json.dumps(dict(probe=name,exit=p.returncode,elapsed=round(time.monotonic()-began,2),sample=p.stdout[:100],timing=p.stdout.splitlines()[-1:] or [],error=p.stderr[:300])),flush=True)
              except Exception as exc:
                  print(json.dumps(dict(probe=name,elapsed=round(time.monotonic()-began,2),error=type(exc).__name__+': '+str(exc))),flush=True)
          probes = [('urllib default',[]),('urllib browser UA',[]),('urllib TLS 1.2',[]),('curl default',[]),('curl IPv4',['-4']),('curl HTTP 1.1',['--http1.1'])]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(lambda args: probe(*args), probes))
          PY
