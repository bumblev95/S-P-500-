name: Validate prospective forecast blends

on:
  push:
    paths:
      - 'research/joint-indicator/prospective-blend-v1/**'
      - 'scripts/prospective_blends.py'
      - 'scripts/freeze_prospective_blends.py'
      - 'scripts/audit_prospective_blends.py'
      - 'scripts/test_prospective_blends.py'
      - '.github/workflows/freeze-prospective-blends.yml'
      - '.github/workflows/validate-prospective-blends.yml'
  pull_request:
    paths:
      - 'research/joint-indicator/prospective-blend-v1/**'
      - 'scripts/prospective_blends.py'
      - 'scripts/freeze_prospective_blends.py'
      - 'scripts/audit_prospective_blends.py'
      - 'scripts/test_prospective_blends.py'
      - '.github/workflows/freeze-prospective-blends.yml'
      - '.github/workflows/validate-prospective-blends.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run prospective blend regressions
        run: python -m unittest discover -s scripts -p test_prospective_blends.py
      - name: Compile research scripts
        run: python -m py_compile scripts/prospective_blends.py scripts/freeze_prospective_blends.py scripts/audit_prospective_blends.py
