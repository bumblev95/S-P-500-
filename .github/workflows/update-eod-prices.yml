name: Update S&P 500 EOD prices

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_learned_forecasts.py'
      - 'scripts/update_eod_prices.py'
      - 'scripts/requirements-ml.txt'
      - 'scripts/build_stability_research.py'
      - 'scripts/build_forecasts.py'
      - 'scripts/eod_publication.py'
      - 'scripts/eod_close_fallback.py'
      - 'scripts/eod_symbol_mapping.py'
      - 'scripts/eod_close_schedule.py'
      - 'scripts/requirements-eod.txt'
      - '.github/workflows/update-eod-prices.yml'
  workflow_dispatch:
    inputs:
      public_prices_only:
        description: "Use existing public price tickers; do not read Google Sheets"
        type: boolean
        default: false
  schedule:
    # Start at regular/early exchange close; XNYS calendar skips the unused slot
    # and holidays. The collector keeps its 15-minute completion buffer.
    - cron: "0 13,16 * * 1-5"
      timezone: "America/New_York"
    # Bounded recovery if the first run is delayed, dropped or lacks a close.
    # An already-complete session skips collection and downstream research.
    - cron: "35 13,16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update-eod-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install public price dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-eod.txt

      - name: Collect and validate the first complete settled EOD snapshot
        id: collect
        env:
          FORECAST_PUBLIC_PRICES_ONLY: ${{ github.event_name == 'push' && 'true' || github.event.inputs.public_prices_only || 'false' }}
        run: |
          if [ "$FORECAST_PUBLIC_PRICES_ONLY" = "true" ]; then
            python scripts/eod_close_schedule.py --public-prices-only --receipt "$RUNNER_TEMP/eod-request.json"
          else
            python scripts/eod_close_schedule.py --receipt "$RUNNER_TEMP/eod-request.json"
          fi

      - name: Validate and atomically publish complete prices and forecasts
        if: steps.collect.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/eod_publication.py publish --receipt "$RUNNER_TEMP/eod-request.json" --bundle "$RUNNER_TEMP/eod-release"

      - name: Transfer the exact published inputs to follow-up research
        if: steps.collect.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eod-research-inputs
          path: ${{ runner.temp }}/eod-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Refresh the published dashboard
        if: steps.collect.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
