name: Update S&P 500 EOD prices

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_learned_forecasts.py'
      - 'scripts/update_eod_prices.py'
      - 'scripts/requirements-ml.txt'
      - 'scripts/build_stability_research.py'
  workflow_dispatch:
    inputs:
      public_prices_only:
        description: "Use existing public price tickers; do not read Google Sheets"
        type: boolean
        default: false
  schedule:
    # Runs after the U.S. market close on weekdays. Adjust if you want a different refresh time.
    - cron: "30 23 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update-eod-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-ml.txt

      - name: Download EOD prices
        env:
          FORECAST_PUBLIC_PRICES_ONLY: ${{ github.event_name == 'push' && 'true' || github.event.inputs.public_prices_only || 'false' }}
        run: |
          if [ "$FORECAST_PUBLIC_PRICES_ONLY" = "true" ]; then
            python scripts/update_eod_prices.py --public-prices-only
          else
            python scripts/update_eod_prices.py
          fi

      - name: Build forecasts and preserve issue records
        run: python scripts/build_forecasts.py

      - name: Train and validate learned forecasts
        run: python scripts/build_learned_forecasts.py

      - name: Audit realized targets and chronological separation
        run: python scripts/audit_learned_results.py

      - name: Evaluate relative price error and stability candidates
        run: python scripts/build_stability_research.py

      - name: Compare forecasts without using future outcomes for selection
        run: python scripts/build_forecast_comparison.py

      - name: Evaluate forecast correction and regime blending
        run: python scripts/build_adaptive_research.py

      - name: Score first-issued forecasts against realized prices
        run: python scripts/score_live_forecasts.py

      - name: Commit updated price file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices/latest_prices.csv forecasts ml
          git diff --cached --quiet || git commit -m "Update S&P 500 EOD prices"
          git pull --rebase origin main
          git push

      - name: Refresh the published dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
