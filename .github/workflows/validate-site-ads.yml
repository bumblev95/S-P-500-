name: Validate site advertising integration
on:
  pull_request:
    paths:
      - 'index.html'
      - 'stocks.html'
      - 'privacy.html'
      - 'learn.html'
      - 'guide-*.html'
      - 'methodology.html'
      - 'about.html'
      - 'contact.html'
      - 'terms.html'
      - 'assets/site-info.css'
      - 'scripts/check_site_information.cjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'research/adsense-root-site/index.html'
      - 'assets/site-ads*'
      - 'scripts/*site_ads*'
      - 'research/AD-MONETIZATION.md'
      - '.github/workflows/validate-site-ads.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'stocks.html'
      - 'privacy.html'
      - 'learn.html'
      - 'guide-*.html'
      - 'methodology.html'
      - 'about.html'
      - 'contact.html'
      - 'terms.html'
      - 'assets/site-info.css'
      - 'scripts/check_site_information.cjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'research/adsense-root-site/index.html'
      - 'assets/site-ads*'
      - 'scripts/*site_ads*'
      - 'research/AD-MONETIZATION.md'
      - '.github/workflows/validate-site-ads.yml'
permissions:
  contents: read
jobs:
  advertising:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate identifiers and disabled defaults
        run: |
          node --check assets/site-ads.js
          node --check assets/site-ads-config.js
          node scripts/test_site_ads.cjs
          node scripts/check_site_information.cjs
      - name: Install browser validation runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify advertising without contacting a real provider
        run: node scripts/check_site_ads_browser.cjs
      - name: Verify static guides and site information without JavaScript
        run: node scripts/check_site_information.cjs --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advertising-preview
          path: ad-preview/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-information-preview
          path: site-information-preview/
          retention-days: 7
